name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # 1.4.4, as on the maintainers' machines. 1.4.0 segfaulted on Windows after the test summary.
  BUN_VERSION: "1.4.4"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        # The suite takes seconds; a hang (seen with Bun on Windows) should fail fast, not use the job's 15 minutes.
        timeout-minutes: 10

  menubar:
    # The SwiftUI menu bar app builds on macOS only.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: ./menubar/build.sh
